port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: true
mode: rule
log-level: info
ipv6: false
keep-alive-interval: 15
keep-alive-idle: 15
find-process-mode: off
unified-delay: true
tcp-concurrent: true
external-controller: '127.0.0.1:9090'
geodata-mode: false
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.netloading.net"
    - "*.jsdelivr.net"
    - "gh-proxy.*"
    - "ghproxy.*"
    - "gh.api.*.*"
    - "connectivitycheck.platform.hicloud.com" # 华为
    - "captive.apple.com" # 苹果
    - "dns.alidns.com"
    - "doh.pub"
    - "dns.google"
    - "cloudflare-dns.com"
    - "dns.adguard.com"
    - "rule-set:fakeipfilter"
    - "rule-set:private"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
  nameserver-policy:
    "rule-set:gamecn": [223.5.5.5, 119.29.29.29]
    "rule-set:directdm": ["https://doh.pub/dns-query", "https://dns.alidns.com/dns-query"]
  direct-nameserver-follow-policy: true
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://cloudflare-dns.com/dns-query#h3=true
    - https://8.8.8.8/dns-query
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.apple.com"
    - "+.microsoft.com"
  skip-src-address:
    - 192.168.1.1/24
    - 192.168.66.1/24
    - 192.168.100.1/24
    - 192.168.31.1/24
    - 192.168.3.1/24
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24
proxy-groups:
  - name: 🌏默认代理
    type: select
    proxies:
      - 🇭🇰香港
      - 🇯🇵日本
      - 🇹🇼台湾
      - 🇸🇬新加坡
      - 🇰🇷韩国
      - 🇺🇸美国
      - 🌐其他
      - DIRECT
  - name: 🇭🇰香港
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "(?i)港|hk|hongkong|hong kong|🇭🇰"
    interval: 300
    url: "https://www.gstatic.com/generate_204"
    lazy: true
    timeout: 5000
    max-failed-times: 5
  - name: 🇯🇵日本
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "(?i)日本|jp|japan|东京|ty|🇯🇵"
    interval: 300
    url: "https://www.gstatic.com/generate_204"
    lazy: true
    timeout: 5000
    max-failed-times: 5
  - name: 🇹🇼台湾
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "(?i)台|tw|taiwan|tp|🇹🇼"
    interval: 300
    url: "https://www.gstatic.com/generate_204"
    lazy: true
    timeout: 5000
    max-failed-times: 5
  - name: 🇸🇬新加坡
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "(?i)加坡|sg|singapore|sin|🇸🇬"
    interval: 300
    url: "https://www.gstatic.com/generate_204"
    lazy: true
    timeout: 5000
    max-failed-times: 5
  - name: 🇰🇷韩国
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "(?i)韩|kr|korea|首尔|seoul|🇰🇷"
    interval: 300
    url: "https://www.gstatic.com/generate_204"
    lazy: true
    timeout: 5000
    max-failed-times: 5
  - name: 🇺🇸美国
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "(?i)美|us|unitedstates|united states|americ|洛杉|la|纽约|ny|🇺🇸"
    interval: 300
    url: "https://www.gstatic.com/generate_204"
    lazy: true
    timeout: 5000
    max-failed-times: 5
  - name: 🌐其他
    type: select
    include-all-proxies: true
    include-all-providers: true
    exclude-filter: "(?i)港|hk|hongkong|hong kong|🇭🇰|日本|jp|japan|东京|ty|🇯🇵|台|tw|taiwan|tp|🇹🇼|加坡|sg|singapore|sin|🇸🇬|韩|kr|korea|首尔|seoul|🇰🇷|美|us|unitedstates|united states|americ|洛杉|la|纽约|ny|🇺🇸|订阅|剩余|重置|到期|加入|机场|官网|地址|过期|xpire|raffic|websi|use|tota"
    interval: 300
    url: "https://www.gstatic.com/generate_204"
    lazy: true
    timeout: 5000
    max-failed-times: 5
  - name: 🚩信息
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "(?i)订阅|剩余|重置|到期|加入|机场|官网|地址|过期|xpire|raffic|websi|use|tota"
    lazy: true
  - name: ⚓稳定IP
    type: select
    proxies: ['🇭🇰香港', '🇯🇵日本', '🇹🇼台湾', '🇸🇬新加坡', '🌐其他']
    include-all-proxies: true
    filter: "(?i)港|hk|hongkong|hong kong|🇭🇰|日本|jp|japan|东京|ty|🇯🇵|台|tw|taiwan|tp|🇹🇼|加坡|sg|singapore|sin|🇸🇬"
  - name: 🎮游戏线路
    type: select
    proxies: ['🇹🇼台湾', '🇭🇰香港', '🇯🇵日本', '🇰🇷韩国', '🌐其他', DIRECT]
    include-all-proxies: true
    filter: "(?i)港|hk|hongkong|hong kong|🇭🇰|日本|jp|japan|东京|ty|🇯🇵|台|tw|taiwan|tp|🇹🇼|韩|kr|korea|首尔|seoul|🇰🇷|游戏|game"
  - name: 🎬影视线路
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: "港|hk|hongkong|hong kong|🇭🇰|日本|jp|japan|东京|ty|🇯🇵|台|tw|taiwan|tp|🇹🇼|加坡|sg|singapore|sin|🇸🇬|韩|kr|korea|首尔|seoul|🇰🇷"
  - name: ✨Ai线路
    type: select
    proxies: ['🇯🇵日本', '🇹🇼台湾', '🇸🇬新加坡', '🇺🇸美国', '🌐其他']
    include-all-proxies: true
    filter: "(?i)日本|jp|japan|东京|ty|🇯🇵|加坡|sg|singapore|sin|🇸🇬|美|us|unitedstates|united states|americ|洛杉|la|纽约|ny|🇺🇸"
  - name: MS+Bing
    type: select
    proxies: ['⚓稳定IP', '🇭🇰香港', '🇯🇵日本', '🇹🇼台湾', '🇸🇬新加坡', '🇺🇸美国', '🌏默认代理', '🌐其他']
  - name: OneDrive
    type: select
    proxies: [DIRECT, 'MS+Bing', '🌏默认代理']
  - name: Google
    type: select
    proxies: ['🇯🇵日本', '🇭🇰香港', '🇸🇬新加坡', '🇺🇸美国', '🇹🇼台湾', '🇰🇷韩国', '🌐其他']
  - name: Apple
    type: select
    proxies: [DIRECT, '🇯🇵日本', '🇭🇰香港', '🇸🇬新加坡', '🇺🇸美国', '🇹🇼台湾', '🇰🇷韩国', '🌐其他', '🌏默认代理']
  - name: 外国媒体
    type: select
    proxies: ['⚓稳定IP', '🌏默认代理']
  - name: 🔎未命中
    type: select
    proxies: ['🌏默认代理', DIRECT]
  - name: 🛑广告拦截
    type: select
    proxies: [REJECT, DIRECT]
